<!--
  Brand + rendering layer for the course sites.

  Everything between the SHARED BEGIN / SHARED END markers below is meant to be
  byte-identical to progintro/lab-material's _includes/head-custom.html. Both repos now
  render with jekyll-theme-primer, so the same selectors apply on both sides and the
  block can be copied across verbatim. If you change a colour or a script here, copy the
  whole block over there (and vice versa) rather than editing one half.

  Below SHARED END are the parts that only exist on this site: the masthead, the student
  work montage, the table of contents card and the exercise pager.
-->

<script>
  /* Mermaid is 1.5 MB and MathJax another 250 KB. Both used to load on every page of
     both sites, and mermaid loaded render-blocking - nothing painted until it had
     downloaded and parsed. Together they were 1.7 MB of the syllabus landing page's
     2.5 MB, and that page contains no diagram and no formula at all; most lab pages
     use one or the other, not both.

     Each is now fetched only if the rendered page actually contains its syntax, and
     always asynchronously. A page with neither loads no third-party JavaScript.

     The ES6 polyfill that used to sit above this was also render-blocking. Every
     browser that needs it has been out of support for years. */
  document.addEventListener("DOMContentLoaded", () => {
    const load = (src, onload) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      if (onload) s.onload = onload;
      document.head.appendChild(s);
    };

    const blocks = document.querySelectorAll("code.language-mermaid");
    if (blocks.length) {
      load("https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js", () => {
        blocks.forEach((block) => {
          const parent = block.parentElement;
          const mermaidDiv = document.createElement("div");
          mermaidDiv.classList.add("mermaid");
          mermaidDiv.innerHTML = block.textContent;
          parent.replaceWith(mermaidDiv);
        });
        mermaid.initialize({ startOnLoad: true });
      });
    }

    /* The delimiters MathJax is configured for below: $x$, $$x$$, \(x\), \[x\]. The
       inline test needs a closing $ on the same line, so the terminal transcripts in
       the handouts ("$ gcc -o foo foo.c") do not drag in a quarter of a megabyte. If
       a page's math is ever missed it renders as its own source, which is visible
       rather than silent. */
    if (/\$\$|\\\(|\\\[|\$[^$\n]+\$/.test(document.body.textContent)) {
      window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
      load("https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js");
    }
  });
</script>

<script>
  /* Theme picker. The <select> is built from THEMES rather than written into the layout,
     so adding a theme is one CSS block plus one line here - two places, not three.

     "auto" is the absence of a stored value, not a theme: it clears storage and lets the
     resolver above fall back to the operating system. */
  (function () {
    var THEMES = [
      ["auto",     "Αυτόματο"],
      ["light",    "Φωτεινό"],
      ["dark",     "Σκοτεινό"],
      ["paper",    "Χαρτί"],
      ["contrast", "Υψηλή αντίθεση"]
    ];
    document.addEventListener("DOMContentLoaded", function () {
      var sel = document.getElementById("theme-select");
      if (!sel || !window.__theme) return;
      THEMES.forEach(function (t) {
        var o = document.createElement("option");
        o.value = t[0];
        o.textContent = t[1];
        sel.appendChild(o);
      });
      sel.value = window.__theme.stored() || "auto";
      sel.addEventListener("change", function () {
        try {
          if (sel.value === "auto") localStorage.removeItem(window.__theme.KEY);
          else localStorage.setItem(window.__theme.KEY, sel.value);
        } catch (e) { /* storage blocked: the choice still applies to this page */ }
        window.__theme.apply(sel.value === "auto" ? null : sel.value);
      });
    });
  })();
</script>


<script>
  /* Theme, applied before first paint.

     Synchronous in <head> on purpose: setting data-theme after the stylesheet has
     painted gives a white flash on every navigation for anyone on a dark theme.

     It also resolves the operating system preference into the attribute, instead of the
     CSS carrying a second copy of the dark tokens under prefers-color-scheme. That copy
     was twenty values that had to be kept identical to [data-theme="dark"] by hand, and
     the failure mode - edit one, forget the other - is silent and shows only for people
     who never opened the picker. The cost is that with JavaScript off everyone gets the
     light theme: readable and correct, just not their preference. */
  window.__theme = (function () {
    var KEY = "progintro-theme";
    function stored() {
      try { return localStorage.getItem(KEY); } catch (e) { return null; }
    }
    function osDark() {
      return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
    function apply(name) {
      document.documentElement.setAttribute(
        "data-theme", name || stored() || (osDark() ? "dark" : "light"));
      /* Keep the mobile browser chrome in step. Read back from the computed --bg
         rather than keeping a per-theme list, which would be one more thing to fill
         in for every new theme and one more thing to forget. */
      var bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (!bg) return;
      var m = document.querySelector('meta[name="theme-color"]');
      if (!m) {
        m = document.createElement("meta");
        m.setAttribute("name", "theme-color");
        document.head.appendChild(m);
      }
      m.setAttribute("content", bg);
    }
    apply();
    if (window.matchMedia) {
      /* Follow the OS while the picker is on "auto" (nothing stored). */
      window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", function () { if (!stored()) apply(); });
    }
    return { KEY: KEY, stored: stored, apply: apply };
  })();
</script>

<style>
  /* ---- Themes -----------------------------------------------------------------

     Everything below is driven by the tokens in :root. A theme is one block that
     redefines them; nothing else in the stylesheet mentions a literal colour, so a new
     theme cannot half-apply. To add one: copy a [data-theme] block, change the values,
     and add an entry to THEMES in the picker script near the end of this file.

     This deliberately lives in the site-specific half rather than the shared block.
     lab-material wants the same treatment eventually, but syncing a design that is
     still being experimented with into two repositories means changing both every time
     a colour moves. It gets promoted once the set of themes settles.

     The jekyll-theme-primer stylesheet hardcodes its colours, so each surface it paints
     is re-pointed at a token further down. That mapping is the fiddly part and is why
     the token list is short: every token added has to be given a value in every theme.
     ------------------------------------------------------------------------------ */

  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #fafbfc;        /* cards: contents, quick links, table stripe */
    --surface-2: #f6f8fa;      /* code blocks */
    --fg: #24292e;
    --fg-muted: #586069;
    --fg-subtle: #6a737d;
    --border: #dfe6ea;
    --border-strong: #c6cbd1;
    --link: #0B7FA3;           /* --dit-cyan */
    --accent: #0B7FA3;
    --heading: #444444;        /* --dit-charcoal */
    --code-inline-bg: rgba(27, 31, 35, 0.05);

    --syn-comment: #68717b;
    --syn-keyword: #ce3746;
    --syn-string: #032f62;
    --syn-number: #005cc5;
    --syn-function: #6f42c1;
    --syn-type: #bc5107;
    --syn-punct: #24292e;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #161b22;
    --fg: #c9d1d9;
    --fg-muted: #8b949e;
    --fg-subtle: #8b949e;
    --border: #30363d;
    --border-strong: #3d444d;
    --link: #4db8d8;           /* the brand cyan lifted until it clears 4.5:1 on #0d1117 */
    --accent: #4db8d8;
    --heading: #e6edf3;
    --code-inline-bg: rgba(110, 118, 129, 0.4);

    --syn-comment: #8b949e;
    --syn-keyword: #ff7b72;
    --syn-string: #a5d6ff;
    --syn-number: #79c0ff;
    --syn-function: #d2a8ff;
    --syn-type: #ffa657;
    --syn-punct: #c9d1d9;
  }

  /* Warm and low-contrast, for reading a long handout rather than scanning a table. */
  [data-theme="paper"] {
    color-scheme: light;
    --bg: #faf4e8;
    --surface: #f3ebda;
    --surface-2: #f1e7d3;
    --fg: #3b3327;
    --fg-muted: #6b5f4c;
    --fg-subtle: #766b5b;
    --border: #ddd0b8;
    --border-strong: #c8b99c;
    --link: #0a6e8f;
    --accent: #0a6e8f;
    --heading: #4a4133;
    --code-inline-bg: rgba(59, 51, 39, 0.07);

    --syn-comment: #726654;
    --syn-keyword: #9c2f2f;
    --syn-string: #2a5c2a;
    --syn-number: #1f5d8f;
    --syn-function: #6b3fa0;
    --syn-type: #98580f;
    --syn-punct: #3b3327;
  }

  /* Maximum separation: for projection in a lecture hall, and for anyone who needs it. */
  [data-theme="contrast"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f2f2f2;
    --fg: #000000;
    --fg-muted: #1a1a1a;
    --fg-subtle: #333333;
    --border: #000000;
    --border-strong: #000000;
    --link: #0000cc;
    --accent: #000000;
    --heading: #000000;
    --code-inline-bg: #ebebeb;

    --syn-comment: #444444;
    --syn-keyword: #a00000;
    --syn-string: #00008b;
    --syn-number: #00008b;
    --syn-function: #551a8b;
    --syn-type: #8b4500;
    --syn-punct: #000000;
  }

  /* ---- Re-pointing Primer at the tokens ---------------------------------------- */

  html, body { background: var(--bg); }
  .markdown-body { color: var(--fg); background: transparent; }
  .markdown-body a { color: var(--link); }
  .markdown-body h1, .markdown-body h2 { border-bottom-color: var(--border); }
  .markdown-body h2 { color: var(--heading); }
  .markdown-body h6 { color: var(--fg-subtle); }
  .markdown-body hr { background-color: var(--border); }
  .markdown-body blockquote { color: var(--fg-muted); border-left-color: var(--border); }
  .markdown-body table tr { background-color: var(--bg); border-top-color: var(--border-strong); }
  .markdown-body table tr:nth-child(2n) { background-color: var(--surface); }
  .markdown-body table td, .markdown-body table th { border-color: var(--border-strong); }
  .markdown-body code, .markdown-body tt { background-color: var(--code-inline-bg); }
  .markdown-body .highlight pre, .markdown-body pre { background-color: var(--surface-2); }
  /* Primer paints an opaque white box behind every image, which shows as a white slab
     around the montage and the crests on any dark theme. */
  .markdown-body img { background-color: transparent; }
  .markdown-body kbd {
    color: var(--fg); background-color: var(--surface);
    border-color: var(--border-strong); box-shadow: none;
  }

  /* Keyboard focus. Primer's focus styling assumes a light background, so on a dark
     theme the ring is close to invisible - which matters more here than usual, since the
     page is mostly links. */
  :where(a, button, select, summary, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  ::selection { background: var(--accent); color: var(--bg); }

  /* ---- Syntax ------------------------------------------------------------------
     Rouge emits 57 token classes. They are grouped here into the seven a C listing
     actually distinguishes, so a new theme sets seven values rather than fifty-seven. */
  .highlight .c, .highlight .c1, .highlight .cm, .highlight .cs, .highlight .cd,
  .highlight .cp { color: var(--syn-comment); font-style: italic; }
  .highlight .k, .highlight .kc, .highlight .kd, .highlight .kn, .highlight .kp,
  .highlight .kr, .highlight .ow { color: var(--syn-keyword); }
  .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .sc,
  .highlight .sd, .highlight .se, .highlight .sh, .highlight .si, .highlight .sx,
  .highlight .sr, .highlight .ss { color: var(--syn-string); }
  .highlight .m, .highlight .mf, .highlight .mh, .highlight .mi, .highlight .mo,
  .highlight .il { color: var(--syn-number); }
  .highlight .nf, .highlight .na, .highlight .nb, .highlight .bp,
  .highlight .nc { color: var(--syn-function); }
  .highlight .kt, .highlight .nt, .highlight .no, .highlight .nn,
  .highlight .nd { color: var(--syn-type); }
  .highlight .p, .highlight .o, .highlight .nv, .highlight .nx,
  .highlight .n { color: var(--syn-punct); }
  .highlight .nl, .highlight .ni, .highlight .ne, .highlight .py,
  .highlight .vc, .highlight .vg, .highlight .vi { color: var(--syn-function); }
  .highlight .kv, .highlight .mx { color: var(--syn-number); }
  .highlight .w { color: var(--fg-subtle); }
  /* Generic and diff output. Primer gives .err/.gd/.gi opaque pastel backgrounds that
     glare on any dark theme; the foreground carries the meaning, so the boxes go. */
  .highlight .err { color: var(--syn-keyword); background-color: transparent; }
  .highlight .gd { color: var(--syn-keyword); background-color: transparent; }
  .highlight .gi { color: var(--syn-string); background-color: transparent; }
  .highlight .gr, .highlight .gt { color: var(--syn-keyword); }
  .highlight .go, .highlight .gp, .highlight .gh,
  .highlight .gu, .highlight .gs, .highlight .ge { color: var(--fg-muted); }
  .highlight, .highlight pre { color: var(--fg); }

  /* The exercise pager lives in the shared block and still resolves --dit-cyan, which
     is a light-theme value. Re-point it here rather than editing the shared half. */
  .lab-nav-top { border-bottom-color: var(--accent); }
  .lab-nav-bottom { border-top-color: var(--accent); }
  .lab-nav a { color: var(--link); }
  .lab-nav-mid { color: var(--fg-subtle); }

  /* Print. Students print the handouts and past exams, and a dark theme on paper is
     both unreadable and an ink bill. Rather than redefining every token for print -
     which would reintroduce exactly the duplicated block removed above - this flattens
     the few surfaces that matter and drops the page furniture. */
  @media print {
    html, body { background: #fff !important; }
    .markdown-body { color: #000 !important; }
    .markdown-body a { color: #000 !important; text-decoration: underline; }
    .markdown-body pre, .markdown-body code, .markdown-body tt,
    .markdown-body .highlight pre { background: #f5f5f5 !important; }
    .markdown-body table tr,
    .markdown-body table tr:nth-child(2n) { background: #fff !important; }
    .markdown-body table td, .markdown-body table th { border-color: #999 !important; }
    /* Navigation, decoration and controls are not worth the paper. */
    .theme-picker, .montage, .github-fork-ribbon, .quicklinks { display: none !important; }
    .masthead { border-bottom-color: #000 !important; }
  }

  /* ---- The picker --------------------------------------------------------------- */
  .theme-picker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--fg-subtle);
  }
  .theme-picker select {
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
  }
</style>

<style>
  /* ---- This site only ---------------------------------------------------------
     The syllabus has a masthead on every page, a montage of student work on the
     landing page, a long table of contents and a pager over the 2023 exam exercises.
     None of that exists in lab-material, so it lives outside the shared block.
     ------------------------------------------------------------------------------ */

  /* Masthead. The crests use .crest-row from the shared block above, so they are sized
     and spaced identically to the ones on lab-material's landing page - and, like
     lab-material, they appear on the landing page only. Inner pages get .masthead-slim:
     the same wordmark bar and cyan rule, without the institutional marks. There is
     deliberately no <h1> here either; every page in this repo opens with its own. */
  .masthead {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 12px;
    margin-bottom: 28px;
  }
  .masthead-slim { padding-bottom: 8px; margin-bottom: 24px; }
  /* Primer's `.markdown-body p { margin-bottom: 16px }` outranks the plain class
     selectors below, so the masthead's own paragraphs are zeroed at equal specificity. */
  .markdown-body .masthead p { margin: 0; }
  .markdown-body .masthead .crest-row { margin-bottom: 8px; }
  .masthead-wordmark {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin: 0;
    font-size: 14px;
  }
  .masthead-wordmark > a {
    color: var(--heading);
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .masthead-wordmark > a:hover { color: var(--accent); }
  /* Flex items default to min-width:auto, so the nav refused to shrink below the width
     of its own text and pushed the whole page sideways on a phone. */
  .masthead-wordmark > a { flex: 0 0 auto; }
  .masthead-links {
    flex: 1 1 auto;
    min-width: 0;
    text-align: right;
    color: var(--fg-subtle);
  }
  .masthead-links a { color: var(--accent); font-weight: 600; }

  @media (max-width: 560px) {
    .masthead-wordmark { display: block; }
    .masthead-links { display: block; margin-top: 6px; text-align: left; }
  }

  /* Student work montage. It used to be a 30%-wide float wedged against the table of
     contents; as a centred banner it reads as the showcase it is, and the caption gives
     the work its credit and a way through to the samples. */
  .montage {
    /* 980px is about what container-lg leaves after px-3. It was 820px when the montage
       was a single image; with the Go panel alongside it, the extra width is what keeps
       the chess board near its old size (~285px tall here, ~341px before, ~239px if this
       stayed at 820px). */
    max-width: 980px;
    margin: 0 auto 36px;
  }
  .montage img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  /* One panel per year, side by side. Giving each image a flex-grow equal to its
     intrinsic width with flex-basis:0 makes the row divide the width in exactly that
     ratio, which for images of equal height means they render at equal height - no
     fixed pixel sizes, and nothing to recompute if a panel is replaced. Adding next
     year's work is one more <img> plus its width here. */
  .montage-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .montage-row img {
    flex-basis: 0;
    min-width: 0;
  }
  .montage-row img:nth-child(1) { flex-grow: 1104; }  /* montage-23-24.webp is 1104x460 */
  .montage-row img:nth-child(2) { flex-grow: 460; }   /* montage-25.webp is 460x460 */
  @media (max-width: 700px) {
    /* The montage is decoration and it sits above every section of the page, so on a
       phone its job is to be thin. Stacking the two panels was the obvious reading of
       "make them legible" and it cost 517px at a 390px viewport - half a screen of
       scrolling before the first heading. Side by side the row is about 105px. The
       stones and pieces are small at that size; they are a banner, not a diagram.
       The caption goes too: it is credit, not navigation. */
    .montage { margin-bottom: 20px; }
    .montage figcaption { display: none; }
  }
  .montage figcaption {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--fg-subtle);
    text-align: center;
  }

  /* Quick links. The four things a student wants during term - what is due, this week's
     slides, this week's handout, and where to ask - reachable without reading the page
     or the contents card. They are plain anchors rather than the real Piazza/Classroom
     URLs on purpose: those change every September and would be one more thing to
     remember, while a heading anchor cannot go stale. Lives in README.md as raw HTML so
     it renders on github.com too. */
  .quicklinks {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    margin: 0 0 20px;
  }
  .quicklinks a {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .quicklinks a:hover {
    border-color: var(--accent);
    background: #fff;
    text-decoration: none;
  }

  /* Table of contents. kramdown's {:toc} emits a bare <ul id="markdown-toc">, which on
     the landing page is fifteen items tall and pushes the first real section below the
     fold. Set as a bordered multi-column card it works as the page index it is. */
  #markdown-toc {
    columns: 3;
    column-gap: 32px;
    list-style: none;
    margin: 0 0 32px;
    padding: 18px 22px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font-size: 14px;
  }
  #markdown-toc li {
    break-inside: avoid;
    margin: 0 0 6px;
  }
  #markdown-toc > li > ul { display: none; }

  @media (max-width: 900px) { #markdown-toc { columns: 2; } }
  @media (max-width: 560px) {
    /* Not one column: sixteen items stacked run about 480px, which on a phone is a
       second screenful of furniture between the title and the first section. Two
       narrow columns with tighter rows halve it, and the entries are short enough
       (one or two words) to survive the narrower measure. */
    #markdown-toc { columns: 2; column-gap: 18px; padding: 14px 16px; font-size: 13px; }
    #markdown-toc li { margin: 0 0 3px; }
  }

  /* The fork ribbon overlaps the crests on a phone, where it is unreadable anyway. */
  @media (max-width: 720px) {
    .github-fork-ribbon { display: none; }
    .crest-row img { max-height: 44px; }
  }

  .site-footer {
    border-top: 1px solid var(--border);
    margin-top: 48px;
    padding-top: 16px;
    font-size: 13px;
    color: var(--fg-subtle);
  }
  .site-footer a { color: var(--accent); }
</style>
